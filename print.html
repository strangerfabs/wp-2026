<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Zum Ausdrucken</title>
<style>
  @page { size: A4 portrait; margin: 0; }

  :root {
    --paper:  #FFFFFF;
    --bubble: #FFB3D1;
    --hot:    #E8398B;
    --butter: #FFD95C;
    --lilac:  #C4A7E7;
    --denim:  #3E5C97;
    --sky:    #A8C4E8;
    --mint:   #A8E0C8;
    --plum:   #6B3A5B;
    --cream:  #FFF6E8;
    --red:    #D62246;
    --ink:    #2A2233;
    --ink-soft: #7A6E85;

    --f-type:  "American Typewriter", "Courier New", Georgia, serif;
    --f-didot: "Didot", "Bodoni 72", Georgia, "Times New Roman", serif;
    --f-black: "Arial Black", "Helvetica Neue", Impact, sans-serif;
    --f-chalk: "Chalkboard SE", "Comic Sans MS", "Marker Felt", cursive;
    --f-hand:  "Bradley Hand", "Noteworthy", "Marker Felt", "Chalkboard SE", cursive;
    --f-mono:  "Courier New", ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    background: #E9E6EE;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    position: relative;
    width: 210mm;
    height: 297mm;
    background: var(--paper);
    margin: 8mm auto;
    box-shadow: 0 4mm 12mm rgba(42,34,51,.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7mm;
    padding: 18mm 16mm;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--f-mono);
    font-size: 3.4mm;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ransom lettering */
  .ransom {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 2mm 4mm;
    line-height: 1;
  }
  .word { display: inline-flex; align-items: flex-end; gap: .6mm; }
  .word > span {
    display: inline-block;
    padding: 1mm 2mm;
    font-size: 14mm;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .l1 { font-family: var(--f-didot); background: var(--bubble); color: var(--cream); transform: rotate(-4deg); }
  .l2 { font-family: var(--f-black); background: var(--butter); color: #fff;         transform: rotate(3deg); }
  .l3 { font-family: var(--f-type);  background: var(--lilac);  color: var(--denim); transform: rotate(-2deg); }
  .l4 { font-family: var(--f-didot); background: var(--cream);  color: var(--hot);   transform: rotate(5deg); font-style: italic; }
  .l5 { font-family: var(--f-black); background: var(--denim);  color: var(--cream); transform: rotate(-3deg); }
  .l6 { font-family: var(--f-mono);  background: var(--mint);   color: var(--plum);  transform: rotate(4deg); font-weight: 700; }
  .l7 { font-family: var(--f-chalk); background: var(--hot);    color: #fff;         transform: rotate(-5deg); }
  .l8 { font-family: var(--f-type);  background: var(--sky);    color: var(--plum);  transform: rotate(2deg); }

  .name {
    font-family: var(--f-hand);
    font-size: 15mm;
    color: var(--hot);
    transform: rotate(-3deg);
    margin-top: 1mm;
  }

  .teaser {
    font-family: var(--f-didot);
    font-size: 8.5mm;
    line-height: 1.3;
    max-width: 125mm;
    text-wrap: balance;
    margin-top: 2mm;
  }
  .teaser em { font-style: italic; color: var(--hot); }

  /* the QR is drawn as foreground SVG, so it prints even when the
     browser is set to leave background graphics out */
  .qr-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3mm;
    margin-top: 1mm;
  }
  .qr {
    width: 62mm;
    height: 62mm;
    display: block;
  }
  .qr-call {
    font-family: var(--f-black);
    font-size: 6mm;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .qr-hint {
    font-family: var(--f-mono);
    font-size: 3.2mm;
    letter-spacing: .1em;
    color: var(--ink-soft);
  }
  .fallback {
    font-family: var(--f-mono);
    font-size: 3mm;
    letter-spacing: .06em;
    color: var(--ink-soft);
    margin-top: 1mm;
  }

  /* stickers */
  .sticker { position: absolute; }
  .sticker svg { display: block; width: 100%; height: auto; }
  .cut { stroke: #fff; stroke-width: 7; paint-order: stroke; stroke-linejoin: round; stroke-linecap: round; }
  .cut .det { stroke: none; }

  .s-cup   { width: 26mm; top: 14mm;  left: 16mm;  transform: rotate(-8deg); }
  .s-disco { width: 30mm; top: 12mm;  right: 15mm; }
  .s-star  { width: 16mm; top: 52mm;  right: 24mm; transform: rotate(14deg); }
  .s-shoe  { width: 30mm; bottom: 20mm; left: 16mm; transform: rotate(-8deg); }
  .s-medal { width: 24mm; bottom: 22mm; right: 18mm; transform: rotate(-10deg); }
  .s-lips  { width: 22mm; top: 60mm;  left: 20mm;  transform: rotate(-14deg); }

  /* screen-only chrome */
  .bar {
    max-width: 210mm;
    margin: 8mm auto 0;
    display: flex;
    gap: 4mm;
    align-items: center;
    justify-content: center;
    font-family: var(--f-mono);
    font-size: 12px;
    color: #4A4356;
  }
  .bar button {
    font-family: var(--f-black);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #fff;
    background: var(--hot);
    border: 0;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .bar button:focus-visible { outline: 3px solid var(--denim); outline-offset: 3px; }

  @media print {
    html, body { background: #fff; }
    .bar { display: none; }
    .sheet { margin: 0; box-shadow: none; }
  }
</style>
</head>
